<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>社員情報登録(入力)</title>
	<link rel="stylesheet" href="/css/entry.css">
</head>

<body>
	<!--全体-->
	<div class="container">
		<!--ヘッダー-->
		<header class="header">
			<p class="header-title">社員情報登録(入力)</p>
			<p class="header-login" th:if="${session.loginUser != null}">
				<span th:text="${session.loginUser.name}"></span> さん<br>
				<span th:text="${#dates.format(#dates.createNow(), 'yyyy/MM/dd HH:mm')}"></span>
			</p>
		</header>
		<hr class="header-hr">
		<!--エラーメッセージ-->
		<div th:if="${errors}">
			<script th:inline="javascript">
				/*<![CDATA[*/
				var errors = /*[[${errors}]]*/[];
				if (errors.length > 0) {
					alert(errors.join('\n'));
				}
				/*]]>*/
			</script>
		</div>
		<!--社員情報登録フォーム-->
		<form action="/confirm" method="post">
			<div class="form-group">
				<label for="name" class="name">社員名</label>
				<input type="text" name="name" id="name" th:value="${name}">
			</div>
			<div class="form-group">
				<label for="age" class="age">年齢</label>
				<input type="text" name="age" id="age" th:value="${age}">
			</div>
			<div class="form-group">
				<label for="password">パスワード</label>
				<input type="password" name="password" id="password" th:value="${password}">
			</div>
			<div class="form-group">
				<label for="passwordConfirm">パスワード確</label>
				<input type="password" name="passwordConfirm" id="passwordConfirm" th:value="${passwordConfirm}">
			</div>
			<hr class="footer-hr">
			<!--確認ボタン-->
			<div class="button-group1">
				<input type="submit" value="確認" class="confirm-button">
			</div>
		</form>
		<form action="/previous" method="post">
			<!--戻るボタン-->
			<div class="button-group2">
				<input type="submit" value="戻る" class="return-button">
			</div>
		</form>
		<!--フッター-->
		<footer class="footer">
			<p>Copyright © 2025 JavaStudy teamD</p>
		</footer>
	</div>
	<a href="/logout">ログアウト</a>
</body>

</html>
