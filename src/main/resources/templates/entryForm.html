<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>社員情報登録(入力)</title>
</head>
<body>
	<div th:if="${errors}">
		<p th:each="error : ${errors}" th:text="${error}"></p>
	</div>
	
	<form action="/confirm" method="post">
		社員名※<input type="text" name="name" th:value="${name}"><br>
		年齢※<input type="text" name="age" th:value="${age}"><br>
		パスワード<input type="password" name="password" th:value="${password}"><br>
		パスワード(確認用)<input type="password" name="passwordConfirm" th:value="${passwordConfirm}"><br>
		<input type="submit" value="確認">
		<input type="button" value="戻る">
	</form>
</body>
</html>
