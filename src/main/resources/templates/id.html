<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<table border="1">
		<tr>
			<th>社員ID</th>
			<th>社員名</th>
			<th>年齢</th>
			<th>パスワード</th>
		</tr>
		<tr th:each="user : ${user}">
			<td th:text="${user.id}"></td>
			<td th:text="${user.name}"></td>
			<td th:text="${user.age}"></td>
			<td th:text="${user.password}"></td>
		</tr>
	</table>
	<div th:if="${user} == null">
		社員IDがありません
	</div>
</body>
</html>
