<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>
</head>
<body>
	<table border="1">
	
	<tr th:each="Loginentity: ${Loginentity}">		
	<label for="username">ID</label>
	<td th:text="${Loginentity.id}"></td>
	<label for="password">パスワード</label>
	<td th:text="${Loginentity.password}"></td>
		
	</tr>
	
	</table>
	<div th:if="${Loginentity} == null">
		IDかパスワードが間違っています。もう一度ご入力ください。
	</div>
	
</body>
</html>
