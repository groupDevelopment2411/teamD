<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>社員情報更新</title>
</head>
<body>
    <h1>社員情報の更新</h1>

    <form action="#" th:action="@{/update/{id}(id=${employee.id})}" method="post">
        <div>
            <label for="name">名前:</label>
            <input type="text" id="name" name="name" th:value="${employee.name}" required/>
        </div>
        <div>
            <label for="age">年齢:</label>
            <input type="number" id="age" name="age" th:value="${employee.age}" required/>
        </div>
        <div>
            <label for="startDate">開始日:</label>
            <input type="date" id="startDate" name="startDate" th:value="${employee.startDate}" required/>
        </div>
        <div>
            <label for="endDate">終了日:</label>
            <input type="date" id="endDate" name="endDate" th:value="${employee.endDate}" required/>
        </div>
        <button type="submit">更新</button>
    </form>

    <a href="/menu">メニューに戻る</a>
</body>
</html>
